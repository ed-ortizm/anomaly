[common]
bin = bin_03

[directory]
user = /home/elom/gdrive/career/portfolio/phd/code_phd
data = ${user}/spectra
bin_data = ${user}/spectra/${common:bin}
model = ${user}/models/${common:bin}
output = ${user}/scores/${common:bin}

[file]
grid = wave_spectra_imputed.npy
specobjid = ${common:bin}_index_specobjid.npy
observation = ${common:bin}_fluxes.npy
reconstruction = ${common:bin}_rec_fluxes.npy

[score]
metric = lp, mad, mse
relative = False, True
percentage = 100, 97
velocity = 0, 250, 300
epsilon = 0.001
lines = OII_3726
    H_delta_4101
    H_gamma_4340
    H_beta_4861
    OIII_4959
    OIII_5006
    NII_6548
    H_alpha_6562
    NII_6583
    SII_6716
    SII_6730

[configuration]
jobs = 12
cores_per_worker = 1
